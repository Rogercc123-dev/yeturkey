<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>access opera.</title>
<style>
  :root { --bg: #000; --fg: #e0e0e0; --accent: #fff; }
  
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; text-transform: lowercase; }
  
  body { 
    background: var(--bg); color: var(--fg); 
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* CUSTOM ALIVE CURSOR */
  #cursor {
    position: fixed; width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transition: transform 0.1s ease;
  }

  /* LAYOUT - YZY SCALE */
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    min-height: 100vh;
    padding: 2vw;
  }

  .nav { grid-column: 1 / 13; border-bottom: 1px solid #333; padding-bottom: 2vw; display: flex; justify-content: space-between; align-items: flex-end; }
  .logo { font-size: 8vw; font-weight: 700; line-height: 0.8; letter-spacing: -0.05em; }
  
  .hero-text { grid-column: 1 / 9; padding-top: 10vh; }
  .hero-text h1 { font-size: 14vw; line-height: 0.85; font-weight: 700; margin-bottom: 4vw; }
  
  .portal-nav { grid-column: 1 / 13; margin-top: 10vh; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vw; }
  .portal-item { border-top: 1px solid #333; padding-top: 2vw; transition: 0.3s; }
  .portal-item:hover { border-color: var(--accent); padding-left: 2vw; }
  .portal-item h2 { font-size: 3vw; margin-bottom: 1vw; }
  .portal-item p { color: #666; font-size: 1vw; }

  /* MOTION */
  .reveal { opacity: 0; transform: translateY(50px); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  .visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

  <div id="cursor"></div>

  <div class="grid">
    <nav class="nav">
      <div class="logo">access<br>opera</div>
      <div style="font-size: 1vw;">est. 2026<br>los angeles</div>
    </nav>

    <section class="hero-text">
      <h1 class="reveal">orchestrating<br>presence.</h1>
    </section>

    <div class="portal-nav">
      <a href="#clients" class="portal-item reveal">
        <h2>clients</h2>
        <p>managed talent.</p>
      </a>
      <a href="#work" class="portal-item reveal">
        <h2>work</h2>
        <p>archived production.</p>
      </a>
      <a href="#services" class="portal-item reveal">
        <h2>services</h2>
        <p>frameworks.</p>
      </a>
      <a href="#contact" class="portal-item reveal">
        <h2>contact</h2>
        <p>inquiries.</p>
      </a>
    </div>
  </div>

  <script>
    // CURSOR LOGIC
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.transform = `translate(${e.clientX - 6}px, ${e.clientY - 6}px)`;
    });

    // INTERSECTION OBSERVER FOR ANIMATION
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if(e.isIntersecting) e.target.classList.add('visible');
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
