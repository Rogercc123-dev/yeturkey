<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>access opera</title>
<meta name="description" content="access opera talent agency" />
<meta name="theme-color" content="#050505" />

<style>
*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --cream: #d4d0c8;
  --off-black: #080808;
  --void: #030303;
  --concrete: #1a1a1a;
  --steel: #555555;
  --akira-red: #e3000f;
}

html {
  background: var(--void);
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: "OCR A BT", "OCR A Std", "OCR A Extended", "Courier New", monospace;
  background: var(--void);
  color: var(--cream);
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  overflow-x: hidden;
  cursor: crosshair;
  /* stripped back, minimal grid */
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* NAV */
.nav-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 999;
  background: rgba(3, 3, 3, 0.8);
  backdrop-filter: blur(5px);
  border-bottom: 1px solid var(--concrete);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 64px;
}
.nav-logo {
  font-size: 16px; 
  color: var(--cream);
  text-decoration: none;
  display: flex;
  flex-direction: column;
}
.nav-logo .jp-sub {
  font-family: sans-serif; /* standard sans for japanese legibility */
  font-size: 9px;
  color: var(--akira-red);
  letter-spacing: 0.2em;
  margin-top: 2px;
}

/* HERO */
.hero-section {
  margin-top: 64px;
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  padding: 80px 24px;
}
.hero-title {
  font-size: clamp(40px, 10vw, 120px);
  color: var(--cream);
  line-height: 0.9; 
  letter-spacing: -0.05em;
  margin-bottom: 8px;
}
.hero-jp-subtitle {
  font-family: sans-serif;
  font-size: clamp(12px, 2vw, 16px);
  color: var(--akira-red);
  letter-spacing: 0.4em;
  margin-left: 4px;
}

/* CARDS */
.cards-section {
  width: 100%;
  padding: 0 24px 80px 24px;
}
.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.minimal-card {
  border: 1px solid var(--concrete);
  background: var(--off-black);
  height: clamp(150px, 25vh, 300px);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--steel);
  font-size: clamp(16px, 3vw, 24px);
  transition: all 0.3s ease;
}
.minimal-card:hover {
  border-color: var(--akira-red);
  color: var(--akira-red);
  background: rgba(227, 0, 15, 0.02);
}

/* DESKTOP */
@media (min-width: 768px) {
  .hero-section {
    padding: 120px 64px;
  }
  .cards-section {
    padding: 0 64px 120px 64px;
  }
  .cards-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<nav class="nav-bar">
  <a href="#" class="nav-logo">
    <span>access opera</span>
    <span class="jp-sub">アクセス・オペラ</span>
  </a>
</nav>

<section class="hero-section">
  <h1 class="hero-title">access opera</h1>
  <div class="hero-jp-subtitle">タレントエージェンシー</div>
</section>

<section class="cards-section">
  <div class="cards-grid">
    <a href="#clients" class="minimal-card">clients</a>
    <a href="#media" class="minimal-card">media</a>
    <a href="#upcoming" class="minimal-card">upcoming</a>
    <a href="#contact" class="minimal-card">contact</a>
  </div>
</section>

</body>
</html>
