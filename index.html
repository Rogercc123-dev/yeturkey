<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>access opera</title>
<meta name="description" content="access opera talent agency" />
<meta name="theme-color" content="#030303" />

<style>
*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --cream: #e6e3da; /* shifted to a slight sepia/cloud tone */
  --off-black: #0a0a0a;
  --void: #030303;
  --concrete: #1f1f1f;
  --steel: #666666;
  --akira-red: #cc0000;
  --portal-glow: rgba(230, 210, 180, 0.06);
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden; 
  background: var(--void);
}

body {
  font-family: "OCR A BT", "OCR A Std", "OCR A Extended", "Courier New", monospace;
  color: var(--cream);
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  cursor: crosshair;
  display: flex;
  flex-direction: column;
  
  /* minimalistic dystopian grid */
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 4vw 4vw;
  position: relative;
}

/* --- NEW: ASCENSION LOADER --- */
#intro-loader {
  position: fixed;
  inset: 0;
  background: var(--void);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeOutLoader 0.1s 2.8s forwards;
}

.portal-ring {
  width: 2px;
  height: 2px;
  background: var(--cream);
  border-radius: 50%;
  box-shadow: 0 0 60px 30px var(--portal-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: ascensionPortal 2.5s cubic-bezier(0.85, 0, 0.15, 1) forwards;
}

.loader-text {
  font-family: sans-serif;
  font-weight: bold;
  font-size: 1px; /* scales up with the portal */
  letter-spacing: 0.5em;
  color: var(--void);
  text-transform: uppercase;
  opacity: 0;
  animation: strobeText 2.5s forwards;
}

@keyframes ascensionPortal {
  0% { transform: scale(1); box-shadow: 0 0 0px 0px var(--portal-glow); }
  40% { transform: scale(50); box-shadow: 0 0 60px 30px var(--portal-glow); }
  100% { transform: scale(3000); opacity: 0; }
}

@keyframes strobeText {
  0%, 35% { opacity: 0; }
  36%, 38% { opacity: 1; }
  39%, 41% { opacity: 0; }
  42%, 60% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes fadeOutLoader {
  to { opacity: 0; visibility: hidden; pointer-events: none; }
}
/* ------------------------------ */

/* atmospheric background glow */
.atmospheric-glow {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70vw;
  height: 70vw;
  border-radius: 50%;
  background: radial-gradient(circle, var(--portal-glow) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* subtle dark vignette edge */
.vignette {
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
  pointer-events: none;
  z-index: 1;
}

/* --- NEW: CYBERPUNK SCANLINES --- */
.scanlines {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
  background-size: 100% 4px;
  z-index: 2;
  pointer-events: none;
  opacity: 0.6;
}

/* NAV */
.nav-bar {
  position: relative;
  z-index: 10;
  flex-shrink: 0;
  height: 80px;
  display: flex;
  align-items: center;
  padding: 0 4vw;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.nav-logo {
  font-size: 14px; 
  color: var(--steel);
  text-decoration: none;
  display: flex;
  flex-direction: column;
}
.nav-logo .jp-sub {
  font-family: sans-serif;
  font-size: 8px;
  color: var(--akira-red);
  letter-spacing: 0.25em;
  margin-top: 4px;
}

/* MAIN LAYOUT */
.content-wrapper {
  position: relative;
  z-index: 10;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  padding: 0 4vw 4vh 4vw;
}

/* HERO */
.hero-section {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero-title {
  font-size: clamp(40px, 9vw, 130px);
  color: var(--cream);
  line-height: 0.85; 
  letter-spacing: -0.06em;
  margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(230, 210, 180, 0.15);
}
.hero-jp-subtitle {
  font-family: sans-serif;
  font-size: clamp(10px, 1.5vw, 14px);
  color: var(--steel);
  letter-spacing: 0.5em;
  margin-left: 4px;
}

/* CARDS */
.cards-section {
  flex-shrink: 0;
  height: 22vh; 
  min-height: 120px;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1vw;
  height: 100%;
}

.minimal-card {
  border: 1px solid var(--concrete);
  background: rgba(10, 10, 10, 0.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--steel);
  font-size: clamp(14px, 1.5vw, 20px);
  /* Changed to a harsh, instant strobe transition */
  transition: all 0.05s linear;
  position: relative;
  overflow: hidden;
}

.minimal-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cream);
  opacity: 0;
  /* Harsh transition */
  transition: opacity 0.05s linear;
  z-index: -1;
}

.minimal-card:hover {
  border-color: var(--cream);
  color: var(--void);
  font-weight: bold;
  letter-spacing: 0.1em; /* Slight structural shift on hover */
}

.minimal-card:hover::before {
  opacity: 1;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px) {
  .cards-section {
    height: 35vh; 
  }
  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
  }
  .atmospheric-glow {
    width: 120vw;
    height: 120vw;
  }
}
</style>
</head>

<body>
  <div id="intro-loader">
    <div class="portal-ring">
      <div class="loader-text">ACCESS</div>
    </div>
  </div>

  <div class="atmospheric-glow"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <nav class="nav-bar">
    <a href="#" class="nav-logo">
      <span>access opera</span>
      <span class="jp-sub">アクセス・オペラ</span>
    </a>
  </nav>

  <main class="content-wrapper">
    <section class="hero-section">
      <h1 class="hero-title">access opera</h1>
      <div class="hero-jp-subtitle">タレントエージェンシー</div>
    </section>

    <section class="cards-section">
      <div class="cards-grid">
        <a href="#clients" class="minimal-card">clients</a>
        <a href="#media" class="minimal-card">media</a>
        <a href="#upcoming" class="minimal-card">upcoming</a>
        <a href="#contact" class="minimal-card">contact</a>
      </div>
    </section>
  </main>

  <script>
    // Clean up the DOM after the pure CSS animation finishes
    setTimeout(() => {
      const loader = document.getElementById('intro-loader');
      if(loader) loader.remove();
    }, 3000);
  </script>
</body>
</html>
