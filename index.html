<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>access opera</title>
<meta name="description" content="access opera talent agency" />
<meta name="theme-color" content="#030303" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --cream: #e6e3da;
  --void: #030303;
  --concrete: #1f1f1f;
  --steel: #666666;
  --akira-red: #cc0000;
  --portal-glow: rgba(230, 210, 180, 0.04);
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden; 
  background: var(--void);
  cursor: none; 
}

body {
  /* OCR A BT is prioritized, but Share Tech Mono guarantees the look globally */
  font-family: "OCR A BT", "OCR A Std", "Share Tech Mono", "Courier New", monospace;
  color: var(--cream);
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* --- CUSTOM CURSOR --- */
.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 12px;
  height: 12px;
  background: var(--cream);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
  transition: width 0.2s, height 0.2s, border-radius 0.2s;
}

body:hover .cursor-dot { opacity: 1; }

a:hover ~ .cursor-dot, .minimal-card:hover ~ .cursor-dot {
  width: 40px;
  height: 40px;
}

/* --- ATMOSPHERE --- */
.atmospheric-glow {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80vw;
  height: 80vw;
  border-radius: 50%;
  background: radial-gradient(circle, var(--portal-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* MAIN LAYOUT */
.content-wrapper {
  position: relative;
  z-index: 10;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  padding: 4vh 4vw; /* Adjusted padding since header is gone */
}

/* --- HERO & CINEMATIC LOAD --- */
.hero-section {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

@keyframes heavyFadeIn {
  from { opacity: 0; transform: translateY(15px); filter: blur(5px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.hero-title {
  font-size: clamp(40px, 9vw, 130px);
  color: var(--cream);
  line-height: 0.85; 
  letter-spacing: -0.06em;
  margin-bottom: 8px;
  position: relative;
  opacity: 0;
  animation: heavyFadeIn 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
}

.hero-jp-subtitle {
  font-family: sans-serif;
  font-size: clamp(10px, 1.5vw, 14px);
  color: var(--steel);
  letter-spacing: 0.5em;
  margin-left: 4px;
  opacity: 0;
  animation: heavyFadeIn 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
}

/* --- CARDS & HARSH CLIPPING REVEAL --- */
.cards-section {
  flex-shrink: 0;
  height: 22vh; 
  min-height: 120px;
  opacity: 0;
  animation: heavyFadeIn 2s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1vw;
  height: 100%;
}

.minimal-card {
  border: 1px solid var(--concrete);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--steel);
  font-size: clamp(14px, 1.5vw, 20px);
  position: relative;
  overflow: hidden;
  cursor: none;
}

.minimal-card span {
  position: relative;
  z-index: 2;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.minimal-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cream);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.3s cubic-bezier(0.76, 0, 0.24, 1);
  z-index: 1;
}

.minimal-card:hover span {
  color: var(--void);
  font-weight: bold;
  transform: translateY(-2px);
}

.minimal-card:hover::before {
  transform: scaleY(1);
  transform-origin: top;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px) {
  .cards-section { height: 35vh; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; }
  body { cursor: auto; } 
  .cursor-dot { display: none; }
}
</style>
</head>

<body>
  <div class="atmospheric-glow"></div>

  <main class="content-wrapper">
    <section class="hero-section">
      <h1 class="hero-title">access opera</h1>
      <div class="hero-jp-subtitle">タレントエージェンシー</div>
    </section>

    <section class="cards-section">
      <div class="cards-grid">
        <a href="#clients" class="minimal-card"><span>clients</span></a>
        <a href="#media" class="minimal-card"><span>media</span></a>
        <a href="#upcoming" class="minimal-card"><span>upcoming</span></a>
        <a href="#contact" class="minimal-card"><span>contact</span></a>
      </div>
    </section>
  </main>

  <div class="cursor-dot"></div>
  <script>
    const cursor = document.querySelector('.cursor-dot');
    let mouseX = 0;
    let mouseY = 0;
    let cursorX = 0;
    let cursorY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      let distX = mouseX - cursorX;
      let distY = mouseY - cursorY;
      
      cursorX = cursorX + (distX * 0.2); 
      cursorY = cursorY + (distY * 0.2);
      
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
</body>
</html>
