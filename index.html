<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>access opera.</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    text-transform: lowercase !important; 
  }
  
  body {
    background: #f4f4f0; /* Classic Yeezy Bone/Cream */
    color: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    line-height: 1;
    overflow-x: hidden;
  }

  /* RAW GRID ARCHITECTURE */
  .section {
    min-height: 100vh;
    padding: 4vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* MASSIVE TYPOGRAPHY */
  h1 {
    font-size: 15vw;
    letter-spacing: -0.06em; /* Extremely tight tracking */
    margin-bottom: 3rem;
  }

  p {
    font-size: 5vw;
    letter-spacing: -0.05em;
    line-height: 1.1;
    max-width: 90vw;
  }

  /* HARSH UTILITY GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2vw;
    margin-top: 10vh;
  }

  .item {
    font-size: 3vw;
    letter-spacing: -0.03em;
    border-top: 3px solid #000;
    padding-top: 2vh;
    padding-bottom: 2vh;
  }

  a {
    color: #000;
    text-decoration: none;
  }

  a:hover {
    background: #000;
    color: #f4f4f0;
  }

  /* BRUTALIST 3D CANVAS */
  #canvas-container {
    width: 100%;
    height: 50vh;
    background: #000;
    margin: 8vh 0;
    cursor: crosshair;
  }

  @media(max-width: 768px) {
    p { font-size: 9vw; max-width: 100%; }
    .grid { grid-template-columns: 1fr; margin-top: 5vh; }
    .item { font-size: 6vw; border-top: 2px solid #000; }
    #canvas-container { height: 40vh; }
  }
</style>
</head>
<body>

  <div class="section">
    <h1>access opera.</h1>
    <p>mary.</p>
    <p>nebuchadnezzar.</p>
    <p>istanbul 90k.</p>

    <div id="canvas-container"></div>

    <p>we build the moments.</p>

    <div class="grid">
      <div class="item">production.</div>
      <div class="item">artist management.</div>
      <div class="item">creative consulting.</div>
      <div class="item"><a href="mailto:info@accessopera.com">contact.</a></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // YEEZY SUPPLY BRUTALIST WIREFRAME ROTATION
    const cont = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, cont.clientWidth / cont.clientHeight, 0.1, 1000);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(cont.clientWidth, cont.clientHeight);
    cont.appendChild(renderer.domElement);

    // Raw geometric knot, zero lighting, pure wireframe
    const geo = new THREE.TorusKnotGeometry(0.8, 0.3, 100, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0xf4f4f0, wireframe: true });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    // Unrelenting spin
    function animate() {
      requestAnimationFrame(animate);
      mesh.rotation.x += 0.002;
      mesh.rotation.y += 0.004;
      renderer.render(scene, camera);
    }
    animate();

    // Snap to resize
    window.addEventListener('resize', () => {
      camera.aspect = cont.clientWidth / cont.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(cont.clientWidth, cont.clientHeight);
    });
  </script>
</body>
</html>
