<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>access opera</title>
<meta name="description" content="access opera talent agency" />
<meta name="theme-color" content="#030303" />

<style>
*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --cream: #e6e3da;
  --void: #030303;
  --concrete: #1f1f1f;
  --steel: #666666;
  --akira-red: #cc0000;
  --portal-glow: rgba(230, 210, 180, 0.04);
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden; 
  background: var(--void);
  cursor: none; /* Hiding default cursor for the custom one */
}

body {
  font-family: "OCR A BT", "OCR A Std", "OCR A Extended", "Courier New", monospace;
  color: var(--cream);
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* --- CUSTOM CURSOR --- */
.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 12px;
  height: 12px;
  background: var(--cream);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
  transition: width 0.2s, height 0.2s, border-radius 0.2s;
}

body:hover .cursor-dot { opacity: 1; }
/* Expanding cursor on clickable items */
a:hover ~ .cursor-dot {
  width: 40px;
  height: 40px;
}

/* --- ATMOSPHERE & NOISE --- */
.noise-overlay {
  position: fixed;
  inset: -50%;
  width: 200%;
  height: 200%;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
  animation: staticNoise 0.2s infinite steps(2);
}

@keyframes staticNoise {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-2%, -2%); }
}

.atmospheric-glow {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80vw;
  height: 80vw;
  border-radius: 50%;
  background: radial-gradient(circle, var(--portal-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* NAV */
.nav-bar {
  position: relative;
  z-index: 10;
  flex-shrink: 0;
  height: 80px;
  display: flex;
  align-items: center;
  padding: 0 4vw;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.nav-logo {
  font-size: 14px; 
  color: var(--steel);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  cursor: none;
}
.nav-logo .jp-sub {
  font-family: sans-serif;
  font-size: 8px;
  color: var(--akira-red);
  letter-spacing: 0.25em;
  margin-top: 4px;
}

/* MAIN LAYOUT */
.content-wrapper {
  position: relative;
  z-index: 10;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  padding: 0 4vw 4vh 4vw;
}

/* --- HERO & GLITCH TYPOGRAPHY --- */
.hero-section {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.glitch-wrapper {
  position: relative;
  display: inline-block;
  width: fit-content;
}

.hero-title {
  font-size: clamp(40px, 9vw, 130px);
  color: var(--cream);
  line-height: 0.85; 
  letter-spacing: -0.06em;
  margin-bottom: 8px;
  position: relative;
  animation: glitchLoad 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}

.hero-title::before, .hero-title::after {
  content: "access opera";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.8;
}

.hero-title::before {
  color: #0ff;
  z-index: -1;
  animation: glitchAnim 2s infinite linear alternate-reverse;
}

.hero-title::after {
  color: var(--akira-red);
  z-index: -2;
  animation: glitchAnim 2.5s infinite linear alternate-reverse;
}

@keyframes glitchLoad {
  0% { transform: skew(0deg) translateY(50px); opacity: 0; filter: blur(10px); }
  20% { transform: skew(-20deg) translateY(0); opacity: 1; filter: blur(0); }
  40% { transform: skew(10deg); }
  60% { transform: skew(-5deg); }
  80% { transform: skew(2deg); }
  100% { transform: skew(0); }
}

@keyframes glitchAnim {
  0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
  20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
  40% { clip-path: inset(40% 0 50% 0); transform: translate(2px, 2px); }
  60% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -2px); }
  80% { clip-path: inset(10% 0 70% 0); transform: translate(2px, -2px); }
  100% { clip-path: inset(30% 0 50% 0); transform: translate(-2px, 2px); }
}

.hero-jp-subtitle {
  font-family: sans-serif;
  font-size: clamp(10px, 1.5vw, 14px);
  color: var(--steel);
  letter-spacing: 0.5em;
  margin-left: 4px;
}

/* --- CARDS & HARSH CLIPPING REVEAL --- */
.cards-section {
  flex-shrink: 0;
  height: 22vh; 
  min-height: 120px;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1vw;
  height: 100%;
}

.minimal-card {
  border: 1px solid var(--concrete);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--steel);
  font-size: clamp(14px, 1.5vw, 20px);
  position: relative;
  overflow: hidden;
  cursor: none;
}

.minimal-card span {
  position: relative;
  z-index: 2;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.minimal-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cream);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.3s cubic-bezier(0.76, 0, 0.24, 1);
  z-index: 1;
}

.minimal-card:hover span {
  color: var(--void);
  font-weight: bold;
  transform: translateY(-2px);
}

.minimal-card:hover::before {
  transform: scaleY(1);
  transform-origin: top;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px) {
  .cards-section { height: 35vh; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; }
  body { cursor: auto; } /* Disable custom cursor on mobile */
  .cursor-dot { display: none; }
}
</style>
</head>

<body>
  <div class="noise-overlay"></div>
  <div class="atmospheric-glow"></div>

  <nav class="nav-bar">
    <a href="#" class="nav-logo">
      <span>access opera</span>
      <span class="jp-sub">アクセス・オペラ</span>
    </a>
  </nav>

  <main class="content-wrapper">
    <section class="hero-section">
      <div class="glitch-wrapper">
        <h1 class="hero-title">access opera</h1>
      </div>
      <div class="hero-jp-subtitle">タレントエージェンシー</div>
    </section>

    <section class="cards-section">
      <div class="cards-grid">
        <a href="#clients" class="minimal-card"><span>clients</span></a>
        <a href="#media" class="minimal-card"><span>media</span></a>
        <a href="#upcoming" class="minimal-card"><span>upcoming</span></a>
        <a href="#contact" class="minimal-card"><span>contact</span></a>
      </div>
    </section>
  </main>

  <div class="cursor-dot"></div>
  <script>
    const cursor = document.querySelector('.cursor-dot');
    let mouseX = 0;
    let mouseY = 0;
    let cursorX = 0;
    let cursorY = 0;

    // Fast tracking for the mouse position
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Smooth physics loop for the cursor dot
    function animateCursor() {
      let distX = mouseX - cursorX;
      let distY = mouseY - cursorY;
      
      cursorX = cursorX + (distX * 0.2); // Adjust 0.2 for lag/smoothness
      cursorY = cursorY + (distY * 0.2);
      
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
</body>
</html>
