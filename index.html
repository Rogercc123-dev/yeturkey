<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>access opera</title>
<meta name="description" content="access opera talent agency" />
<meta name="theme-color" content="#030303" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">

<style>
/* --- CUSTOM FONT INJECTION --- */
@font-face {
  font-family: 'OCR A BT';
  src: url('OCR-a___.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap; 
}

/* Backup import just in case the HTML links fail */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&family=Noto+Sans+JP:wght@300;500&display=swap');

*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --cream: #e6e3da;
  --void: #030303;
  --concrete: #1f1f1f;
  --steel: #7a7a7a;
  --portal-glow: rgba(230, 210, 180, 0.05);
  --grid-line: rgba(255, 255, 255, 0.03);
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden; 
  background-color: var(--void);
  cursor: none; 
}

body {
  /* Courier New has been completely removed from the fallback stack */
  font-family: 'OCR A BT', 'IBM Plex Mono', sans-serif;
  color: var(--cream);
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  display: flex;
  flex-direction: column;
  position: relative;
  
  /* Sharper, more premium architectural grid */
  background-image: 
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 3vw 3vw;
  background-position: center center;
}

/* --- CUSTOM CURSOR --- */
.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 10px;
  height: 10px;
  background: var(--cream);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

body:hover .cursor-dot { opacity: 1; }

a:hover ~ .cursor-dot, .minimal-card:hover ~ .cursor-dot {
  width: 50px;
  height: 50px;
}

/* --- ATMOSPHERE --- */
.atmospheric-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90vw;
  height: 90vw;
  border-radius: 50%;
  background: radial-gradient(circle, var(--portal-glow) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  animation: breathe 8s ease-in-out infinite alternate;
}

@keyframes breathe {
  0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
}

/* MAIN LAYOUT */
.content-wrapper {
  position: relative;
  z-index: 10;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  padding: 6vh 6vw; 
}

/* --- HERO & CINEMATIC LOAD --- */
.hero-section {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

@keyframes heavyFadeIn {
  0% { opacity: 0; transform: translateY(20px); filter: blur(8px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* --- LOGO STYLING FOR PNG --- */
.hero-logo {
  width: clamp(250px, 40vw, 700px); 
  height: auto;
  object-fit: contain;
  margin-bottom: 16px;
  opacity: 0;
  animation: heavyFadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}

.hero-jp-subtitle {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  font-size: clamp(10px, 1.2vw, 14px);
  color: var(--steel);
  letter-spacing: 0.6em;
  /* Shifted to the right to align better with the PNG */
  margin-left: 1.5vw; 
  opacity: 0;
  animation: heavyFadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
}

/* --- CARDS & HARSH CLIPPING REVEAL --- */
.cards-section {
  flex-shrink: 0;
  height: 20vh; 
  min-height: 140px;
  opacity: 0;
  animation: heavyFadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px; 
  height: 100%;
  background: var(--grid-line); 
  border: 1px solid var(--grid-line);
}

.minimal-card {
  background: var(--void);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--steel);
  font-size: clamp(14px, 1.2vw, 18px);
  position: relative;
  overflow: hidden;
  cursor: none;
  transition: color 0.1s;
}

.minimal-card span {
  position: relative;
  z-index: 2;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.minimal-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cream);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.4s cubic-bezier(0.76, 0, 0.24, 1);
  z-index: 1;
}

.minimal-card:hover span {
  color: var(--void);
  font-weight: bold;
  letter-spacing: 0.15em; 
}

.minimal-card:hover::before {
  transform: scaleY(1);
  transform-origin: top;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px) {
  .cards-section { height: 35vh; }
  .cards-grid { 
    grid-template-columns: repeat(2, 1fr); 
    grid-template-rows: repeat(2, 1fr); 
  }
  body { cursor: auto; background-size: 8vw 8vw; } 
  .cursor-dot { display: none; }
  
  .hero-jp-subtitle {
    /* Adjusting mobile shift slightly */
    margin-left: 4vw;
  }
}
</style>
</head>

<body>
  <div class="atmospheric-glow"></div>

  <main class="content-wrapper">
    <section class="hero-section">
      <img src="opera.png" alt="access opera logo" class="hero-logo" />
      <div class="hero-jp-subtitle">タレントエージェンシー</div>
    </section>

    <section class="cards-section">
      <div class="cards-grid">
        <a href="#clients" class="minimal-card"><span>clients</span></a>
        <a href="#media" class="minimal-card"><span>media</span></a>
        <a href="#upcoming" class="minimal-card"><span>upcoming</span></a>
        <a href="#contact" class="minimal-card"><span>contact</span></a>
      </div>
    </section>
  </main>

  <div class="cursor-dot"></div>
  <script>
    const cursor = document.querySelector('.cursor-dot');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      let distX = mouseX - cursorX;
      let distY = mouseY - cursorY;
      
      cursorX = cursorX + (distX * 0.15); 
      cursorY = cursorY + (distY * 0.15);
      
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
</body>
</html>
