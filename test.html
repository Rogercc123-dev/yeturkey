<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZY</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .interface-container {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .interface-container:hover {
            transform: scale(1.02);
        }

        .hold-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            border: 2px solid #cccccc;
            color: #666666;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.3);
        }

        .hold-button:hover {
            background: #f8f8f8;
            border-color: #999999;
            transform: scale(1.05);
            box-shadow: 0 0 0 20px rgba(0, 0, 0, 0.05);
        }

        .hold-button.holding {
            background: #000000;
            border-color: #000000;
            color: transparent;
            transform: scale(1.1);
            box-shadow: 0 0 0 40px rgba(0, 0, 0, 0.1);
        }

        .hold-button.shrinking {
            transform: scale(0.8);
            background: #f0f0f0;
            border-color: #aaaaaa;
        }

       .ring {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: scale(0);
            transition: all 0.8s ease-out;
            filter: blur(0px);
            pointer-events: none;
        }

        .ring.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .ring.blur {
            filter: blur(2px);
            opacity: 0.4;
            transform: scale(0.98);
        }

        .ring-1 {
            width: 200px;
            height: 200px;
            z-index: 15;
        }

        .ring-2 {
            width: 300px;
            height: 300px;
            z-index: 14;
        }

        .ring-3 {
            width: 400px;
            height: 400px;
            z-index: 13;
        }

        .ring-4 {
            width: 500px;
            height: 500px;
            z-index: 12;
        }

        .ring-5 {
            width: 600px;
            height: 600px;
            z-index: 11;
        }

        .rotating-text {
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: 16px;
            font-weight: 400;
            color: #000000;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .text-char {
            position: absolute;
            left: 50%;
            transform-origin: 0 50%;
            transition: all 0.3s ease;
            font-family: 'IBM Plex Mono', monospace;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
        }

        .text-char.selected {
            color: #000000;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .expanded {
            user-select: none;
        }

        .timestamp {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #666666;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'IBM Plex Mono', monospace;
            transition: all 0.3s ease;
        }

        .timestamp:hover {
            color: #000000;
        }

        .menu-icon {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 30px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-icon:hover {
            transform: scale(1.1);
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background: #000000;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-icon:hover .menu-line {
            background: #333333;
        }

        .menu-icon:hover .menu-line:nth-child(1) {
            transform: translateY(2px);
        }

        .menu-icon:hover .menu-line:nth-child(3) {
            transform: translateY(-2px);
        }

        /* Forward rotation */
        .ring-1 .rotating-text,
        .ring-3 .rotating-text,
        .ring-5 .rotating-text {
            animation: rotate 60s linear infinite;
        }

        /* Reverse rotation */
        .ring-2 .rotating-text,
        .ring-4 .rotating-text {
            animation: rotate-reverse 80s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate-reverse {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-360deg);
            }
        }

        .ring.selected {
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.4) 0%, rgba(240, 240, 240, 0.2) 100%);
            border-color: #000000;
            border-width: 3px;
            filter: blur(0px);
            opacity: 1;
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 0, 0, 0.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        .interface-container.expanded {
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.01);
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.1);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="menu-icon">
        <div class="menu-line"></div>
        <div class="menu-line"></div>
        <div class="menu-line"></div>
    </div>
    
    <div class="timestamp"></div>

    <div class="interface-container" id="interfaceContainer">
        <div class="hold-button" id="holdButton">HOLD</div>
        
        <div class="ring ring-1" id="ring1" data-page="shop">
            <div class="rotating-text" id="text1"></div>
        </div>
        
        <div class="ring ring-2" id="ring2" data-page="music">
            <div class="rotating-text" id="text2"></div>
        </div>
        
        <div class="ring ring-3" id="ring3" data-page="media">
            <div class="rotating-text" id="text3"></div>
        </div>
        
        <div class="ring ring-4" id="ring4" data-page="streaming">
            <div class="rotating-text" id="text4"></div>
        </div>
        
        <div class="ring ring-5" id="ring5" data-page="liked">
            <div class="rotating-text" id="text5"></div>
        </div>
    </div>

    <script>
        const holdButton = document.getElementById('holdButton');
        const rings = document.querySelectorAll('.ring');
        const interfaceContainer = document.getElementById('interfaceContainer');
        const timestampElement = document.querySelector('.timestamp');
        
        let isHolding = false;
        let holdTimeout;
        let selectedOption = null;
        let currentRing = -1;

        const pageMappings = {
            'shop': 'shop.html',
            'music': 'discover.html',
            'media': 'discover.html',
            'streaming': 'stream.html',
            'liked': 'liked.html'
        };

        const ringTexts = ['SHOP', 'MUSIC', 'MEDIA', 'STREAMING', 'LIKED'];

        // Create ripple effect
        function createRipple(e) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            
            const rect = e.currentTarget.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            e.currentTarget.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // Get the number of instances for each word
        function getInstanceCount(text) {
            if (text === 'SHOP') return 2;
            if (text === 'MUSIC') return 3;
            return 4; // Default for MEDIA, STREAMING, LIKED
        }

        // Create circular text for each ring with varying instances of each word
        function createCircularText(textElement, text, ringIndex) {
            let radius;
            
            // Define radius for each ring based on its size
            if (ringIndex === 0) { // SHOP
                radius = 70;
            } else if (ringIndex === 1) { // MUSIC
                radius = 120;
            } else if (ringIndex === 2) { // MEDIA
                radius = 170;
            } else if (ringIndex === 3) { // STREAMING
                radius = 230;
            } else if (ringIndex === 4) { // LIKED
                radius = 280;
            }
            
            textElement.innerHTML = '';
            
            for (let instance = 0; instance < getInstanceCount(text); instance++) {
                const totalChars = text.length;
                
                // Calculate optimal spacing based on word length and radius
                let charSpacing;
                if (totalChars <= 4) { // SHOP
                    charSpacing = 25; // Increased for better curve
                } else if (text === 'MUSIC') {
                    charSpacing = 20; // Increased for better curve
                } else if (text === 'MEDIA') {
                    charSpacing = 10;
                } else if (text === 'LIKED') {
                    charSpacing = 8; // Reduced from 12 to tighten spacing
                } else { // STREAMING (9 chars)
                    charSpacing = 7;
                }
                
                const startAngle = (instance * (360 / getInstanceCount(text))) - ((totalChars * charSpacing) / 2); 
                
                for (let i = 0; i < totalChars; i++) {
                    const char = document.createElement('span');
                    char.className = 'text-char';
                    char.textContent = text[i];
                    
                    const angle = startAngle + (i * charSpacing);
                    
                    // Calculate x and y coordinates on the circle
                    const x = Math.cos((angle - 90) * Math.PI / 180) * radius;
                    const y = Math.sin((angle - 90) * Math.PI / 180) * radius;
                    
                    char.style.left = `calc(50% + ${x}px)`;
                    char.style.top = `calc(50% + ${y}px)`;
                    // Rotate each character to be readable while following the circle curve
                    char.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
                    char.style.setProperty('--char-rotation', angle + 'deg');
                    
                    textElement.appendChild(char);
                }
            }
        }

        // Initialize circular text for all rings
        ringTexts.forEach((text, index) => {
            const textElement = document.getElementById(`text${index + 1}`);
            createCircularText(textElement, text, index);
        });

        function getRingFromMousePosition(e) {
            const rect = interfaceContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const distance = Math.sqrt(
                Math.pow(mouseX - centerX, 2) + Math.pow(mouseY - centerY, 2)
            );
            
            const ringRadii = [100, 150, 200, 250, 300]; 

            for (let i = 0; i < ringRadii.length; i++) {
                if (distance <= ringRadii[i]) {
                    return i;
                }
            }
            
            return -1;
        }

        interfaceContainer.addEventListener('mousemove', (e) => {
            if (!interfaceContainer.classList.contains('expanded')) {
                return;
            }
            
            const ringIndex = getRingFromMousePosition(e);
            
            if (ringIndex !== currentRing && ringIndex >= 0) {
                selectRing(ringIndex);
            } else if (ringIndex === -1) {
                clearSelection();
            }
        });

        rings.forEach((ring, index) => {
            ring.addEventListener('click', (e) => {
                createRipple(e);
                if (ring.classList.contains('active')) {
                    const pageKey = ring.dataset.page;
                    navigateToPage(pageKey);
                }
            });
        });

        holdButton.addEventListener('mousedown', startHold);
        holdButton.addEventListener('touchstart', startHold);
        holdButton.addEventListener('click', createRipple);
        
        document.addEventListener('mouseup', endHold);
        document.addEventListener('touchend', endHold);

        function startHold(e) {
            e.preventDefault();
            isHolding = true;
            
            holdButton.classList.add('shrinking');
            
            holdTimeout = setTimeout(() => {
                if (isHolding) {
                    expandRings();
                }
            }, 300);
        }

        function endHold(e) {
            e.preventDefault();
            if (holdTimeout) {
                clearTimeout(holdTimeout);
            }
            
            if (isHolding) {
                if (selectedOption) {
                    navigateToPage(selectedOption);
                } else {
                    collapseRings();
                }
            }
            
            isHolding = false;
            selectedOption = null;
            currentRing = -1;
            holdButton.classList.remove('holding');
            holdButton.classList.remove('shrinking');
        }

        function expandRings() {
            holdButton.classList.remove('shrinking');
            holdButton.classList.add('holding');
            holdButton.textContent = '';
            interfaceContainer.classList.add('expanded');
            
            rings.forEach((ring, index) => {
                setTimeout(() => {
                    ring.classList.add('active');
                }, index * 200);
            });
        }

        function selectRing(ringIndex) {
            if (!interfaceContainer.classList.contains('expanded')) {
                return;
            }
            
            currentRing = ringIndex;
            
            rings.forEach((ring, index) => {
                ring.classList.remove('selected');
                if (index !== ringIndex) {
                    ring.classList.add('blur');
                } else {
                    ring.classList.remove('blur');
                }
            });
            
            const currentRingElement = rings[ringIndex];
            currentRingElement.classList.add('selected');
            selectedOption = currentRingElement.dataset.page;
        }

        function clearSelection() {
            currentRing = -1;
            selectedOption = null;
            
            rings.forEach((ring) => {
                ring.classList.remove('selected');
                ring.classList.remove('blur');
            });
        }

        function collapseRings() {
            interfaceContainer.classList.remove('expanded');
            holdButton.classList.remove('holding');
            holdButton.classList.remove('shrinking');
            
            rings.forEach((ring, index) => {
                setTimeout(() => {
                    ring.classList.remove('active');
                    ring.classList.remove('selected');
                    ring.classList.remove('blur');
                }, index * 80);
            });
            
            setTimeout(() => {
                holdButton.textContent = 'HOLD';
            }, 600);
        }

        function navigateToPage(pageKey) {
            const targetUrl = pageMappings[pageKey];
            
            if (!targetUrl) {
                console.error(`No URL found for page key: ${pageKey}`);
                collapseRings();
                return;
            }

            holdButton.textContent = pageKey.toUpperCase();
            
            interfaceContainer.style.transform = 'scale(0.9)';
            setTimeout(() => {
                interfaceContainer.style.transform = 'scale(1)';
            }, 200);
            
            setTimeout(() => {
                if (targetUrl.startsWith('http://') || targetUrl.startsWith('https://')) {
                    window.open(targetUrl, '_blank');
                    collapseRings();
                } else {
                    window.location.href = targetUrl;
                }
            }, 500);
        }

        function updateTimestamp() {
            const now = new Date();
            const day = now.getDate().toString().padStart(2, '0');
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const year = now.getFullYear();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ms = now.getMilliseconds().toString().padStart(3, '0');
            
            timestampElement.textContent = `${day} ${month} ${year} ${hours}:${minutes}:${seconds}:${ms.slice(0, 2)}`;
        }

        setInterval(updateTimestamp, 100);
        updateTimestamp();
    </script>
</body>
</html>
