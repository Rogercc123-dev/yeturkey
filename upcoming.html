<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>upcoming | access opera</title>
<meta name="theme-color" content="#030303" />

<style>
/* --- STRICT CUSTOM FONT INJECTION --- */
@font-face {
  font-family: 'OCR A BT';
  src: url('OCR-a___.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --cream: #e6e3da;
  --void: #030303;
  --concrete: #1f1f1f;
  --steel: #555555;
  --portal-glow: rgba(230, 210, 180, 0.06);
  --grid-line: rgba(255, 255, 255, 0.04);
}

html, body {
  width: 100vw;
  min-height: 100vh;
  background-color: var(--void);
  cursor: none; 
  overflow-x: hidden;
}

body {
  font-family: 'OCR A BT';
  color: var(--cream);
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  display: flex;
  flex-direction: column;
  position: relative;
  
  /* Sharper architectural grid */
  background-image: 
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 4vw 4vw;
  background-position: center top;
}

/* --- CUSTOM CURSOR --- */
.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 8px;
  height: 8px;
  background: var(--cream);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
  transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

body:hover .cursor-dot { opacity: 1; }
a:hover ~ .cursor-dot {
  width: 60px;
  height: 60px;
}

/* --- ATMOSPHERE & BACKGROUND ANIMATION --- */
.atmospheric-glow {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100vw;
  height: 100vw;
  border-radius: 50%;
  background: radial-gradient(circle, var(--portal-glow) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
  animation: breathe 10s ease-in-out infinite alternate;
}

@keyframes breathe {
  0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
  100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}

/* MASSIVE BACKGROUND TICKER */
.bg-marquee {
  position: fixed;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  width: 100vw;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
  opacity: 0.03; 
}

.bg-marquee-content {
  display: flex;
  white-space: nowrap;
  font-size: 25vw;
  color: transparent;
  -webkit-text-stroke: 2px var(--cream);
  animation: scrollMarquee 40s linear infinite;
}

@keyframes scrollMarquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* MAIN LAYOUT */
.content-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  padding: 6vh 6vw; 
  min-height: 100vh;
}

/* --- HEADER / NAVIGATION --- */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10vh;
  opacity: 0;
  animation: heavyFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
}

.nav-logo {
  width: clamp(150px, 20vw, 300px); 
  height: auto;
  object-fit: contain;
}

.back-link {
  color: var(--steel);
  text-decoration: none;
  font-size: clamp(12px, 1.2vw, 16px);
  cursor: none;
  position: relative;
}

.back-link::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 100%;
  height: 1px;
  background: var(--steel);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.3s;
}

.back-link:hover { color: var(--cream); }
.back-link:hover::after { transform: scaleX(1); transform-origin: left; background: var(--cream); }

/* --- PAGE TITLE --- */
.page-title {
  font-size: clamp(40px, 6vw, 100px);
  color: var(--cream);
  margin-bottom: 4vh;
  opacity: 0;
  transform: translateY(20px);
  animation: heavyFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
}

@keyframes heavyFadeIn {
  0% { opacity: 0; filter: blur(10px); transform: translateY(20px); }
  100% { opacity: 1; filter: blur(0); transform: translateY(0); }
}

/* --- DYNAMIC EVENT ROWS --- */
.events-container {
  display: flex;
  flex-direction: column;
  width: 100%;
  border-top: 1px solid var(--grid-line);
  opacity: 0;
  animation: heavyFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
}

.event-row {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 5vh 2vw;
  border-bottom: 1px solid var(--grid-line);
  text-decoration: none;
  position: relative;
  overflow: hidden;
  cursor: none;
}

/* The background wipe effect */
.event-row::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cream);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.4s cubic-bezier(0.76, 0, 0.24, 1);
  z-index: 1;
}

/* Event Data Columns */
.event-data {
  position: relative;
  z-index: 2;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.e-date {
  width: 20%;
  color: var(--steel);
  font-size: clamp(14px, 1.5vw, 20px);
}

.e-artist {
  width: 40%;
  color: var(--cream);
  font-size: clamp(24px, 4vw, 60px);
  font-weight: bold;
}

.e-location {
  width: 25%;
  color: var(--steel);
  font-size: clamp(14px, 1.5vw, 20px);
}

.e-status {
  width: 15%;
  text-align: right;
  color: var(--steel);
  font-size: clamp(12px, 1.2vw, 16px);
}

/* Hover Physics */
.event-row:hover::before {
  transform: scaleY(1);
  transform-origin: top;
}

.event-row:hover .e-artist {
  color: var(--void);
  letter-spacing: 0.1em; /* Aggressive expansion */
}

.event-row:hover .e-date,
.event-row:hover .e-location,
.event-row:hover .e-status {
  color: var(--void);
  font-weight: bold;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px) {
  body { cursor: auto; background-size: 8vw 8vw; } 
  .cursor-dot { display: none; }
  .bg-marquee-content { font-size: 40vw; }
  
  .event-row {
    flex-direction: column;
    align-items: flex-start;
    padding: 4vh 4vw;
    gap: 1.5vh;
  }
  
  .e-date, .e-artist, .e-location, .e-status {
    width: 100%;
    text-align: left;
  }
  
  .e-artist { font-size: 32px; }
  .e-status { margin-top: 2vh; border-top: 1px solid var(--grid-line); padding-top: 1vh; }
}
</style>
</head>

<body>
  <div class="bg-marquee">
    <div class="bg-marquee-content">
      UPCOMING &nbsp; UPCOMING &nbsp; UPCOMING &nbsp; UPCOMING &nbsp;
    </div>
  </div>

  <div class="atmospheric-glow"></div>

  <div class="content-wrapper">
    
    <header class="header">
      <a href="index.html">
        <img src="opera.png" alt="access opera logo" class="nav-logo" />
      </a>
      <a href="index.html" class="back-link">[ return ]</a>
    </header>

    <h1 class="page-title">upcoming.</h1>

    <div class="events-container">
      
      <a href="ye.html" class="event-row">
        <div class="event-data e-date">30 may</div>
        <div class="event-data e-artist">YE</div>
        <div class="event-data e-location">istanbul</div>
        <div class="event-data e-status">enter_</div>
      </a>

      <a href="#" class="event-row" style="pointer-events: none;">
        <div class="event-data e-date">tba</div>
        <div class="event-data e-artist">---</div>
        <div class="event-data e-location">---</div>
        <div class="event-data e-status">locked_</div>
      </a>

    </div>
  </div>

  <div class="cursor-dot"></div>
  
  <script>
    const cursor = document.querySelector('.cursor-dot');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      let distX = mouseX - cursorX;
      let distY = mouseY - cursorY;
      cursorX += distX * 0.15; 
      cursorY += distY * 0.15;
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
</body>
</html>
